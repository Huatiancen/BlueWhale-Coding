<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f7f8f8">
    <title>BlueWhale</title>
    <link rel="stylesheet" href="/static/styles.css?v=codex-ui-2">
  </head>
  <body>
    <a class="skip-link" href="#workspace-main">跳到对话</a>

    <div class="app-shell">
      <aside class="sidebar" aria-labelledby="app-title">
        <header class="sidebar-header">
          <div class="brand-lockup">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4.2 13.2c1.2 3.6 4 5.6 7.8 5.6 4.5 0 7.3-2.6 7.8-6.9-1.4 1.1-3 1.7-4.9 1.7-2.7 0-4.7-1.1-6.2-3.4-.5 1.7-2 2.8-4.5 3Z"></path><path d="M15.7 8.8c.5-1.8 1.8-3 3.9-3.5-.1 2.2-1 3.8-2.8 4.8"></path></svg>
            </span>
            <h1 id="app-title">BlueWhale</h1>
          </div>
          <button id="refresh-runs" class="icon-button" type="button" aria-label="刷新任务"><span aria-hidden="true">↻</span></button>
        </header>

        <div id="desktop-controls" class="desktop-controls" hidden>
          <button id="open-project" class="project-button" type="button"><span aria-hidden="true">+</span><span>打开项目</span></button>
        </div>

        <nav class="session-nav" aria-label="历史任务">
          <p class="sidebar-label">任务</p>
          <ol id="session-list" class="session-list"></ol>
          <div id="session-empty" class="sidebar-empty">
            <p>还没有任务</p>
            <small>选择项目后，给 BlueWhale 一个目标。</small>
          </div>
        </nav>

        <footer class="sidebar-footer">
          <div class="connection-cluster" data-state="idle" hidden>
            <span class="pulse-dot" aria-hidden="true"></span>
            <span id="connection-status" aria-live="polite">正在连接</span>
          </div>
          <button id="open-model-settings" class="settings-button" type="button" hidden><span aria-hidden="true">⚙</span><span>模型设置</span></button>
        </footer>
      </aside>

      <main id="workspace-main" class="workspace-main" tabindex="-1">
        <section id="conversation-shell" class="conversation-shell" aria-label="Agent 对话">
          <header class="conversation-header">
            <div class="conversation-title">
              <h2 id="active-run-title">新任务</h2>
              <span id="run-status" class="run-status" hidden>未运行</span>
            </div>
          </header>

          <div class="conversation-scroll">
            <div id="conversation-panel" class="conversation-feed" aria-live="polite"></div>
            <div id="conversation-empty" class="welcome-state">
              <div class="welcome-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48"><path d="M7 27c2.4 7.5 8.2 11.5 16 11.5 9.2 0 15-5.4 16-14.1-2.8 2.2-6.2 3.5-10 3.5-5.5 0-9.7-2.3-12.7-7-1.1 3.5-4.2 5.5-9.3 6.1Z"></path><path d="M30.5 18c1-3.8 3.7-6.2 8.1-7.2-.2 4.6-2.1 7.8-5.9 9.9"></path></svg>
              </div>
              <h2>今天想做什么？</h2>
              <p>BlueWhale 会阅读项目、完成修改，并在交付前运行验证。</p>
            </div>
            <section id="work-details" class="work-details" aria-label="工作过程"></section>
            <p id="app-notice" class="notice" role="status" aria-live="polite" hidden></p>
          </div>

          <div id="composer-shell" class="composer-shell">
            <form id="task-form" class="task-form">
              <label class="sr-only" for="task-input">给 BlueWhale 一个任务</label>
              <textarea id="task-input" name="task" rows="1" required placeholder="让 BlueWhale 修复、实现或解释…"></textarea>
              <div class="composer-toolbar">
                <div class="context-control">
                  <div class="workspace-field">
                    <label class="sr-only" for="workspace-input">工作区</label>
                    <input id="workspace-input" name="workspace" value="." autocomplete="off">
                  </div>
                  <button id="desktop-project" class="project-context" type="button" hidden>
                    <span class="folder-icon" aria-hidden="true">▣</span>
                    <span class="project-copy"><strong id="project-name">选择项目</strong><small id="project-path">未授权工作区</small></span>
                  </button>
                  <div class="permission-control">
                    <button id="permission-trigger" class="permission-trigger" type="button" aria-haspopup="menu" aria-expanded="false">
                      <span class="permission-trigger-icon" aria-hidden="true">◉</span>
                      <span id="permission-label">帮我批准</span>
                      <span class="permission-chevron" aria-hidden="true">⌄</span>
                    </button>
                    <div id="permission-menu" class="permission-menu" role="menu" aria-label="权限模式" hidden>
                      <button class="permission-option" type="button" role="menuitemradio" aria-checked="false" data-permission-mode="ask">
                        <span class="permission-option-icon" aria-hidden="true">✋</span>
                        <span class="permission-option-copy"><strong>请求批准</strong><small>编辑文件和运行命令时始终询问</small></span>
                        <span class="permission-check" aria-hidden="true">✓</span>
                      </button>
                      <button class="permission-option" type="button" role="menuitemradio" aria-checked="true" data-permission-mode="balanced">
                        <span class="permission-option-icon" aria-hidden="true">◉</span>
                        <span class="permission-option-copy"><strong>帮我批准</strong><small>仅对检测到的风险操作请求批准</small></span>
                        <span class="permission-check" aria-hidden="true">✓</span>
                      </button>
                      <button class="permission-option full" type="button" role="menuitemradio" aria-checked="false" data-permission-mode="full">
                        <span class="permission-option-icon" aria-hidden="true">!</span>
                        <span class="permission-option-copy"><strong>完全访问权限</strong><small>可不受限制地访问互联网和工作区内文件</small></span>
                        <span class="permission-check" aria-hidden="true">✓</span>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="composer-actions">
                  <button id="stop-run" class="send-button stop" type="button" aria-label="停止任务" hidden><span aria-hidden="true">■</span></button>
                  <button id="submit-task" class="send-button" type="submit" aria-label="发送任务"><span aria-hidden="true">↑</span></button>
                </div>
              </div>
            </form>
            <p class="composer-hint">BlueWhale 可能会犯错，重要变更请查看工作过程。</p>
          </div>
        </section>
      </main>
    </div>

    <dialog id="model-settings" class="settings-dialog" aria-labelledby="model-settings-title">
      <form id="api-key-form">
        <div class="dialog-heading">
          <div><p class="dialog-eyebrow">模型访问</p><h2 id="model-settings-title">DeepSeek 设置</h2></div>
          <button id="close-model-settings" class="icon-button" type="button" aria-label="关闭模型设置">×</button>
        </div>
        <p class="dialog-copy">API Key 仅保存在 macOS 钥匙串中，不会在界面中回显。</p>
        <label for="api-key-input">新的 API Key</label>
        <input id="api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
        <p id="api-key-status" class="secret-status" role="status">正在检查配置</p>
        <div class="dialog-actions">
          <button id="clear-api-key" class="button secondary" type="button">清除密钥</button>
          <button id="save-api-key" class="button primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/static/js/app.js?v=codex-ui-2"></script>
  </body>
</html>
